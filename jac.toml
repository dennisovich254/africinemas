[project]
name = "africinemas"
jac-version = "==0.37.18"
default-app = "web"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "neutral"
font = "figtree"
radius = "default"
menuAccent = "subtle"
menuColor = "default"

[dependencies.npm]
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/figtree" = "*"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[apps.web]
kind = "web-app"
entry-point = "main"

[apps.desktop]
kind = "desktop"
entry-point = "desktop.main"

[apps.desktop.dependencies.npm]
jac-client-node = "1.0.7"

[apps.desktop.dependencies.npm.dev]
"@jac-client/dev-deps" = "1.0.0"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"

[apps.mobile.dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-native-web = "^0.19.13"
react-native-svg = "^15.13.0"
lucide-react = "^0.469.0"
lucide-react-native = "^0.469.0"

[apps.mobile.dependencies.npm.native]
react-native-svg = "^15.13.0"
lucide-react-native = "^0.469.0"

[test]
directory = "tests"

[desktop]
name = "africinemas-counter"
identifier = "com.africinemas.counter"
version = "0.1.0"
engine = "native"
# The desktop app is a window onto the shared server (ADR-0001), never an embedded DB.
backend = "${AFRICINEMAS_SERVER_URL:-http://localhost:8000}"

[desktop.window]
title = "AfriCinemas"
width = 1280
height = 800
min_width = 1024
min_height = 700
resizable = true
