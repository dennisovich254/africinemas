# Keeps the SHA-pinned GitHub Actions current. Dependabot updates both the SHA and the
# version comment. Jac, Python and npm dependencies are managed through jac.toml, which
# Dependabot can't read; bump those by hand in a PR (and .jac-version for Jac itself).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
