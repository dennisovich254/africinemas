[project]
name = "africinemas"
jac-version = "==0.37.18"
default-app = "web"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "neutral"
font = "figtree"
radius = "default"
menuAccent = "subtle"
menuColor = "default"

[dependencies.npm]
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/figtree" = "*"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[apps.web]
kind = "web-app"
entry-point = "main"

[apps.desktop]
kind = "desktop"
entry-point = "desktop.main"

[apps.desktop.dependencies.npm]
jac-client-node = "1.0.7"

[apps.desktop.dependencies.npm.dev]
"@jac-client/dev-deps" = "1.0.0"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"

[apps.mobile.dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-native-web = "^0.19.13"
react-native-svg = "^15.13.0"
lucide-react = "^0.469.0"
lucide-react-native = "^0.469.0"

[apps.mobile.dependencies.npm.native]
react-native-svg = "^15.13.0"
lucide-react-native = "^0.469.0"

[test]
directory = "tests"

[desktop]
name = "africinemas-counter"
identifier = "com.africinemas.counter"
version = "0.1.0"
engine = "native"
# The desktop app is a window onto the shared server (ADR-0001), never an embedded DB.
backend = "${AFRICINEMAS_SERVER_URL:-http://localhost:8000}"

[desktop.window]
title = "AfriCinemas"
width = 1280
height = 800
min_width = 1024
min_height = 700
resizable = true

# ---------------------------------------------------------------------------
# Profiles (plan P0.7). Selected by --profile, then JAC_PROFILE, then default_profile.
# Two Jac 0.37.18 caveats shape this section (tests/unit/config_tests.jac guards both):
#   - JI-014: overriding a *nested* table (e.g. [environments.production.serve.limits])
#     crashes the server's settings loader. Profiles override top-level keys only;
#     nested production settings come from JAC_SERVE_* env vars in deploy/production.env.
#   - JI-015: required-variable placeholders keep their literal text when the variable is
#     unset, so secrets are never referenced here. They come only from the environment
#     (JAC_SERVE_AUTH_SECRET); if it's unset, Jac mints a random per-project secret.
# ---------------------------------------------------------------------------
[environment]
default_profile = "development"

[environments.development]
# Local development: /docs and /graph stay on; the JWT secret is minted per project.

[environments.test]
inherits = "development"

[environments.production.serve]
docs_enabled = false    # no /docs or /openapi.json
graph_enabled = false   # no /graph graph browser

[environments.production.scale.admin]
# Jac's built-in platform admin would otherwise be created as admin / "changeme" on first
# start (ADR-0001). AfriCinemas has its own platform roles, so production doesn't create it.
enabled = false
