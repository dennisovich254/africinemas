[project]
name = "africinemas"
jac-version = "==0.37.18"
default-app = "web"

[client.app_meta_data]
title = "AfriCinemas"
description = "Cinema tickets, booked in seconds."

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "neutral"
font = "outfit"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
[dependencies.npm]
"@hugeicons/core-free-icons" = "^4.2.3"
"@hugeicons/react" = "^1.1.9"
"@fontsource-variable/outfit" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@fontsource/bebas-neue" = "^5.3.0"

[client.assets]
# One assets folder for every app (web and desktop render the same pages), served at
# /static/assets/<path>. Video for the landing page hero (P3.9).
dir = "assets"
custom_extensions = [".webm", ".mp4"]

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[apps.web]
kind = "web-app"
entry-point = "main"

[apps.desktop]
kind = "desktop"
entry-point = "desktop.main"

[apps.desktop.dependencies.npm]
jac-client-node = "1.0.7"

[apps.desktop.dependencies.npm.dev]
"@jac-client/dev-deps" = "1.0.0"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"

[apps.mobile.dependencies.npm]
# The apps share one node_modules, so these pins set React for web and desktop too.
# React 19 is required for Radix asChild triggers to receive refs (docs/jac-issues/JI-019).
react = "^19.2.0"
react-dom = "^19.2.0"
react-native-web = "^0.21.2"
react-native-svg = "^15.13.0"
lucide-react = "^0.469.0"
lucide-react-native = "^0.469.0"

[apps.mobile.dependencies.npm.native]
react-native-svg = "^15.13.0"
lucide-react-native = "^0.469.0"

[test]
directory = "tests"

[desktop]
name = "africinemas-counter"
identifier = "com.africinemas.counter"
version = "0.1.0"
engine = "native"
# The desktop app is a window onto the shared server (ADR-0001), never an embedded DB.
backend = "${AFRICINEMAS_SERVER_URL:-http://localhost:8000}"

[desktop.window]
title = "AfriCinemas"
width = 1280
height = 800
min_width = 1024
min_height = 700
resizable = true

# ---------------------------------------------------------------------------
# Profiles (plan P0.7). Selected by --profile, then JAC_PROFILE, then default_profile.
# Two Jac 0.37.18 caveats shape this section (tests guard both):
#   - JI-014: the running server IGNORES profile overrides for [serve] settings (top-level
#     and nested), so all [serve] hardening lives in deploy/production.env as JAC_SERVE_*
#     env vars. Profiles do apply to [scale.*] settings (verified over HTTP).
#   - JI-015: required-variable placeholders keep their literal text when the variable is
#     unset, so secrets are never referenced here. They come only from the environment
#     (JAC_SERVE_AUTH_SECRET); if it's unset, Jac mints a random per-project secret.
[serve]
# A request that loses a write race is re-run (Jac's default, up to 5 attempts); wait
# 20 ms x attempt between tries so racing requests don't collide again at once (P3.2).
conflict_backoff_ms = 20

[placement]
# Compile modules for the Python server, never native. Jac's default ("native") compiles
# import-free modules natively, and there an enum return came back as a bare int and a
# custom exception lost its type (docs/jac-issues/JI-026). We don't need native code.
default = "server"

[placement.pins]
# The web UI imports these login-required (def:priv) endpoints. A module-level "server"
# pin makes those imports service-boundary calls, sent with the session token; without
# it the compiler refuses them in a workspace (E5082, docs/jac-issues/JI-027).
"core.tenancy.signup" = "server"
"core.tenancy.tenant_api" = "server"
"core.tenancy.staff_api" = "server"
"core.catalog.venue_api" = "server"
"core.catalog.layout_api" = "server"
"core.catalog.movie_api" = "server"
"core.catalog.screening_api" = "server"
"core.catalog.pricing_api" = "server"
"core.theming.branding_api" = "server"
"core.homepage.home_api" = "server"
# Every web module is browser code, including pure helpers such as web.backoffice.nav
# (under default = "server" a pure def:pub would otherwise become a server endpoint).
"web.*" = "client"

[scale.scheduler]
# Background jobs (@schedule): payment/receipt processing, hold expiry (ADR-0005).
# Static tasks run as Jac's system identity, once per server replica per tick.
enabled = true

# ---------------------------------------------------------------------------
[environment]
default_profile = "development"

[environments.development]
# Local development: /docs and /graph stay on; the JWT secret is minted per project.

[environments.test]
inherits = "development"

# No [environments.production.serve] table: it would be silently ignored (JI-014).
# /docs, /graph, token lifetime and body limits are set in deploy/production.env.

[environments.production.scale.admin]
# Jac's built-in platform admin would otherwise be created as admin / "changeme" on first
# start (ADR-0001). AfriCinemas has its own platform roles, so production doesn't create it.
enabled = false

[dev-dependencies]
playwright = "~=1.63"

[dependencies]
pillow = "~=12.3"
