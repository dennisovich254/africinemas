[project]
name = "africinemas"
jac-version = "==0.38.0"
default-app = "web"

[client.app_meta_data]
title = "AfriCinemas"
description = "Cinema tickets, booked in seconds."

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "neutral"
font = "outfit"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
[dependencies.npm]
"@hugeicons/core-free-icons" = "^4.2.3"
"@hugeicons/react" = "^1.1.9"
"@fontsource-variable/outfit" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@fontsource/bebas-neue" = "^5.3.0"
# Ticket QR codes on the booked panel (P6.1).
"qrcode.react" = "^4.2.0"
# Reading ticket QR codes with the camera on the door scanner (P6.4).
"qr-scanner" = "^1.4.2"
# The storefront design system's font pairings (ADR-0047, styles/design.css).
"@fontsource-variable/raleway" = "^5.3.0"
"@fontsource-variable/fraunces" = "^5.3.0"
"@fontsource-variable/cormorant-garamond" = "^5.3.0"
"@fontsource/anton" = "^5.3.0"
"@fontsource-variable/baloo-2" = "^5.3.0"
"@fontsource-variable/nunito" = "^5.3.0"
"@fontsource-variable/sora" = "^5.3.0"
"@fontsource-variable/dm-sans" = "^5.3.0"
"@fontsource-variable/cinzel" = "^5.3.0"
"@fontsource-variable/inter" = "^5.3.0"

[client.assets]
# One assets folder for every app (web and desktop render the same pages), served at
# /static/assets/<path>. Video for the landing page hero (P3.9).
dir = "assets"
custom_extensions = [".webm", ".mp4"]

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[apps.web]
kind = "web-app"
entry-point = "main"

[apps.desktop]
kind = "desktop"
entry-point = "desktop.main"

[apps.desktop.dependencies.npm]
jac-client-node = "1.0.7"

[apps.desktop.dependencies.npm.dev]
"@jac-client/dev-deps" = "1.0.0"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"

[apps.mobile.dependencies.npm]
# The apps share one node_modules, so these pins set React for web and desktop too.
# React 19 is required for Radix asChild triggers to receive refs (docs/jac-issues/JI-019).
react = "^19.2.0"
react-dom = "^19.2.0"
react-native-web = "^0.21.2"
react-native-svg = "^15.13.0"
lucide-react = "^0.469.0"
lucide-react-native = "^0.469.0"

[apps.mobile.dependencies.npm.native]
react-native-svg = "^15.13.0"
lucide-react-native = "^0.469.0"

[test]
directory = "tests"

[desktop]
name = "africinemas-counter"
identifier = "com.africinemas.counter"
version = "0.1.0"
engine = "native"
# The desktop app is a window onto the shared server (ADR-0001), never an embedded DB.
backend = "${AFRICINEMAS_SERVER_URL:-http://localhost:8000}"

[desktop.window]
title = "AfriCinemas"
width = 1280
height = 800
min_width = 1024
min_height = 700
resizable = true

# ---------------------------------------------------------------------------
# Profiles (plan P0.7). Selected by --profile, then JAC_PROFILE, then default_profile.
# Two Jac 0.37.18 caveats shape this section (tests guard both):
#   - JI-014: the running server IGNORES profile overrides for [serve] settings (top-level
#     and nested), so all [serve] hardening lives in deploy/production.env as JAC_SERVE_*
#     env vars. Profiles do apply to [scale.*] settings (verified over HTTP).
#   - JI-015: required-variable placeholders keep their literal text when the variable is
#     unset, so secrets are never referenced here. They come only from the environment
#     (JAC_SERVE_AUTH_SECRET); if it's unset, Jac mints a random per-project secret.
[serve]
# A request that loses a write race is re-run (Jac's default, up to 5 attempts); wait
# 20 ms x attempt between tries so racing requests don't collide again at once (P3.2).
conflict_backoff_ms = 20

[serve.workers]
# One server process, as before Jac 0.38 (which otherwise starts one per CPU core): the
# chat's per-cinema limits, caches and the test clock live in the process, and a
# read-only re-run after a commit (JI-042) can only happen once per process.
count = 1

[serve.auth.username]
# A storefront customer's sign-in name is "<slug>:<email local part>:<domain>"
# (core/tenancy/storefront_accounts.jac): up to 40 + 1 + 254 characters. Jac 0.38's
# default limit is 64.
max_length = 300

[placement]
# Compile modules for the Python server, never native. Jac's default ("native") compiles
# import-free modules natively, and there an enum return came back as a bare int and a
# custom exception lost its type (docs/jac-issues/JI-026). We don't need native code.
default = "server"

[placement.pins]
# Keep domain implementations on the server. Exposed :protect/:pub declarations
# bridge to the browser; placement pins alone do not expose private functions.
"core.tenancy.signup" = "server"
"core.tenancy.tenant_api" = "server"
"core.tenancy.staff_api" = "server"
"core.catalog.venue_api" = "server"
"core.catalog.layout_api" = "server"
"core.catalog.movie_api" = "server"
"core.catalog.screening_api" = "server"
"core.catalog.pricing_api" = "server"
"core.theming.branding_api" = "server"
"core.homepage.home_api" = "server"
"core.booking.customer_tickets" = "server"
"core.booking.redeem_api" = "server"
"core.booking.counter_api" = "server"
"core.reporting.report_api" = "server"
"core.audit.audit_api" = "server"
"core.reporting.staff_home" = "server"
"core.agent.agent_api" = "server"
"core.oauth.provider" = "server"
"core.oauth.connections" = "server"
"core.snacks.category_api" = "server"
"core.snacks.product_api" = "server"
"core.snacks.venue_api" = "server"
"core.snacks.extras_api" = "server"
"core.snacks.inventory_api" = "server"
"core.snacks.tools_api" = "server"
# Every web module is browser code, including pure helpers such as web.backoffice.nav
# (under default = "server" a pure def:pub would otherwise become a server endpoint).
"web.*" = "client"

[scale.scheduler]
# Background jobs (@schedule): payment/receipt processing, hold expiry (ADR-0005).
# Static tasks run as Jac's system identity, once per server replica per tick.
enabled = true

# ---------------------------------------------------------------------------
[environment]
default_profile = "development"

[environments.development]
# Local development: /docs and /graph stay on; the JWT secret is minted per project.

[environments.test]
inherits = "development"

# No [environments.production.serve] table: it would be silently ignored (JI-014).
# /docs, /graph, token lifetime and body limits are set in deploy/production.env.

[environments.production.scale.admin]
# Jac's built-in platform admin would otherwise be created as admin / "changeme" on first
# start (ADR-0001). AfriCinemas has its own platform roles, so production doesn't create it.
enabled = false

[dev-dependencies.pypi]

[dependencies.pypi]
# The storefront's written page is reviewed from screenshots (ADR-0050): production needs
# the headless browser too: python -m playwright install --with-deps chromium-headless-shell
playwright = "~=1.63"
pillow = "~=12.3"
# Ticket QR codes as PNG images in the ticket email (P6.3); pure Python, no deps.
segno = "~=1.6"
# Theme suggestions read a logo's colours with Material Color Utilities (ADR-0043).
materialyoucolor = "~=3.0"
tinycss2 = "~=1.4"
anthropic = "~=1.15"
potracer = "~=0.0.4"
# Public documents and policies as PDFs (P14.3d): each upload is rebuilt from its pages
# alone, so no script, attachment or form survives (ADR-0069). Pure Python.
pypdf = ">=5.1,<7"
# Each cinema's M-Pesa keys are stored encrypted with AES-GCM (P15.3, ADR-0082).
cryptography = ">=44,<47"

# ---------------------------------------------------------------------------
# The AI booking agent (P8.1): Claude through byLLM (ADR-0049). No key here: the
# provider reads it from the environment (ANTHROPIC_API_KEY), never an env placeholder in
# this file (JI-015).
[byllm.model]
default_model = "anthropic/claude-opus-5-5"

[byllm.call_params]
# No temperature: Claude Opus 5.5 refuses sampling parameters (a 400).
max_output_retries = 2

[byllm.fallback]
# A slow answer becomes the agent's polite fallback, not a stuck chat.
timeout = 40.0
num_retries = 0
